name: Verify GitHub release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:2.10.3
      - run: git fetch --no-tags origin main
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: php scripts/check-release-tag.php "${{ github.event.release.tag_name }}"
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: composer audit --locked
      - name: Build release archive
        env:
          COMPOSER_ROOT_VERSION: ${{ github.event.release.tag_name }}
        run: composer archive --format=zip --file=viapost-laravel-sdk
      - name: Checksum release archive
        run: sha256sum viapost-laravel-sdk.zip > viapost-laravel-sdk.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-package
          path: |
            viapost-laravel-sdk.zip
            viapost-laravel-sdk.zip.sha256
          if-no-files-found: error
          retention-days: 1

  attach-to-github-release:
    needs: verify-and-archive
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composer-package
          path: dist
      - name: Attach Composer archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  attest-build-provenance:
    needs: verify-and-archive
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composer-package
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/viapost-laravel-sdk.zip
