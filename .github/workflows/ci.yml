name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
            phpunit: "^12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:2.10.3
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction
      - run: composer check
      - run: composer audit --locked
      - run: composer test:coverage
      - run: composer archive --format=zip --file=viapost-laravel-sdk
