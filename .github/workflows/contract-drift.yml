name: OpenAPI contract drift

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:2.10.3
      - run: composer install --prefer-dist --no-interaction
      - name: Download canonical contract
        run: php scripts/download-openapi.php https://docs.viapost.io/openapi/public.yaml /tmp/public.yaml
      - run: php scripts/check-openapi.php /tmp/public.yaml
